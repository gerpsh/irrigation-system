<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wiring Diagram — Irrigation System</title>
<style>
  body { margin: 0; background: #fff; display: flex; justify-content: center; padding: 20px; }
  svg { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  .wire-pos { stroke: #c0392b; stroke-width: 2.5; fill: none; }
  .wire-neg { stroke: #2c3e50; stroke-width: 2.5; fill: none; stroke-dasharray: 8,4; }
  .wire-gpio { stroke: #2980b9; stroke-width: 2; fill: none; }
  .component { fill: #fff; stroke: #2c3e50; stroke-width: 2; }
  .component-dark { fill: #34495e; stroke: #2c3e50; stroke-width: 2; }
  .enclosure { fill: none; stroke: #7f8c8d; stroke-width: 2.5; stroke-dasharray: 12,6; rx: 12; }
  .label { font-size: 13px; fill: #2c3e50; }
  .label-sm { font-size: 11px; fill: #555; }
  .label-bold { font-size: 13px; fill: #2c3e50; font-weight: 600; }
  .label-title { font-size: 15px; fill: #2c3e50; font-weight: 700; }
  .label-wire { font-size: 11px; font-weight: 600; }
  .label-pos { fill: #c0392b; }
  .label-neg { fill: #2c3e50; }
  .terminal { fill: #ecf0f1; stroke: #2c3e50; stroke-width: 1.5; }
  .note-box { fill: #f9f9f9; stroke: #bdc3c7; stroke-width: 1.5; rx: 6; }
  .valve-body { fill: #bdc3c7; stroke: #2c3e50; stroke-width: 2; }
  .valve-coil { fill: #95a5a6; stroke: #2c3e50; stroke-width: 1.5; }
  .power-strip { fill: #ecf0f1; stroke: #2c3e50; stroke-width: 2; rx: 6; }
  .outlet { fill: #fff; stroke: #2c3e50; stroke-width: 1.5; }
  .adapter { fill: #7f8c8d; stroke: #2c3e50; stroke-width: 2; rx: 4; }
  .pi-board { fill: #2e7d32; stroke: #1b5e20; stroke-width: 2; rx: 4; }
  .relay-hat { fill: #1565c0; stroke: #0d47a1; stroke-width: 2; rx: 4; }
  .cable-gland { fill: #95a5a6; stroke: #2c3e50; stroke-width: 1.5; }
  .wire-ac { stroke: #e67e22; stroke-width: 4; fill: none; stroke-linecap: round; }
  .ac-plug { fill: #f5f5f5; stroke: #e67e22; stroke-width: 2; }
  .ac-outlet { fill: #f9f1e6; stroke: #e67e22; stroke-width: 2; rx: 6; }
  .label-ac { font-size: 12px; fill: #d35400; font-weight: 700; }
</style>
</head>
<body>
<svg viewBox="0 0 960 680" width="960" height="680">

  <!-- Enclosure -->
  <rect class="enclosure" x="30" y="20" width="520" height="500"/>
  <text class="label-title" x="290" y="48" text-anchor="middle">Weatherproof Enclosure</text>

  <!-- Raspberry Pi board -->
  <rect class="pi-board" x="60" y="70" width="200" height="110"/>
  <text x="160" y="95" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Raspberry Pi</text>
  <!-- GPIO pins visual -->
  <rect x="265" y="85" width="8" height="80" rx="2" fill="#ffd600" stroke="#f9a825" stroke-width="1"/>
  <text class="label-sm" x="280" y="110">40-pin</text>
  <text class="label-sm" x="280" y="124">GPIO</text>

  <!-- Relay HAT -->
  <rect class="relay-hat" x="60" y="195" width="200" height="130"/>
  <text x="160" y="218" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">2-Channel Relay HAT</text>
  <text x="160" y="234" text-anchor="middle" fill="#bbdefb" font-size="10">(stacked on GPIO header)</text>

  <!-- Relay CH1 terminal block -->
  <rect class="terminal" x="80" y="250" width="70" height="24" rx="3"/>
  <text class="label-sm" x="115" y="266" text-anchor="middle">Relay CH1</text>
  <rect class="terminal" x="80" y="278" width="34" height="18" rx="2"/>
  <text class="label-sm" x="97" y="291" text-anchor="middle" font-weight="600">COM</text>
  <rect class="terminal" x="116" y="278" width="34" height="18" rx="2"/>
  <text class="label-sm" x="133" y="291" text-anchor="middle" font-weight="600">NO</text>

  <!-- Relay CH2 terminal block -->
  <rect class="terminal" x="170" y="250" width="70" height="24" rx="3"/>
  <text class="label-sm" x="205" y="266" text-anchor="middle">Relay CH2</text>
  <rect class="terminal" x="170" y="278" width="34" height="18" rx="2"/>
  <text class="label-sm" x="187" y="291" text-anchor="middle" font-weight="600">COM</text>
  <rect class="terminal" x="206" y="278" width="34" height="18" rx="2"/>
  <text class="label-sm" x="223" y="291" text-anchor="middle" font-weight="600">NO</text>

  <!-- GPIO labels -->
  <text class="label-sm" x="75" y="248" fill="#2980b9" font-weight="600">BCM 26</text>
  <text class="label-sm" x="170" y="248" fill="#2980b9" font-weight="600">BCM 20</text>

  <!-- Power strip -->
  <rect class="power-strip" x="60" y="400" width="360" height="55"/>
  <text class="label-bold" x="240" y="420" text-anchor="middle">Power Strip</text>
  <!-- Outlets -->
  <rect class="outlet" x="85" y="430" width="30" height="18" rx="3"/>
  <rect class="outlet" x="165" y="430" width="30" height="18" rx="3"/>
  <rect class="outlet" x="255" y="430" width="30" height="18" rx="3"/>
  <!-- AC power cord: from power strip down through enclosure bottom to wall outlet -->
  <path class="wire-ac" d="M350,455 L350,570"/>
  <text class="label-ac" x="360" y="545">AC cord</text>

  <!-- Wall outlet (below enclosure, clearly outside) -->
  <rect class="ac-outlet" x="320" y="585" width="60" height="50"/>
  <rect x="338" y="598" width="6" height="12" rx="1" fill="#d35400"/>
  <rect x="358" y="598" width="6" height="12" rx="1" fill="#d35400"/>
  <circle cx="351" cy="622" r="3" fill="#d35400"/>
  <text class="label-ac" x="350" y="652" text-anchor="middle">Wall Outlet (120V AC)</text>

  <!-- Pi USB power supply (adapter shape above outlet 1) -->
  <rect class="adapter" x="75" y="365" width="50" height="28" rx="4"/>
  <text x="100" y="383" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">5V USB</text>
  <line x1="100" y1="393" x2="100" y2="430" stroke="#2c3e50" stroke-width="2"/>
  <!-- Cable up to Pi -->
  <path d="M100,365 L100,180" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <text class="label-sm" x="105" y="350">Pi power</text>

  <!-- 12V Adapter 1 -->
  <rect class="adapter" x="155" y="355" width="50" height="38" rx="4"/>
  <text x="180" y="373" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">12V DC</text>
  <text x="180" y="385" text-anchor="middle" fill="#ddd" font-size="8">Adapter 1</text>
  <line x1="180" y1="393" x2="180" y2="430" stroke="#2c3e50" stroke-width="2"/>

  <!-- 12V Adapter 2 -->
  <rect class="adapter" x="245" y="355" width="50" height="38" rx="4"/>
  <text x="270" y="373" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">12V DC</text>
  <text x="270" y="385" text-anchor="middle" fill="#ddd" font-size="8">Adapter 2</text>
  <line x1="270" y1="393" x2="270" y2="430" stroke="#2c3e50" stroke-width="2"/>

  <!-- ============ CIRCUIT 1: Adapter 1 → Relay CH1 → Valve 1 ============ -->

  <!-- Adapter 1 (+) to Relay CH1 COM -->
  <path class="wire-pos" d="M165,355 L165,340 L97,340 L97,296"/>
  <text class="label-wire label-pos" x="130" y="336">+</text>

  <!-- Relay CH1 NO to cable gland to Valve 1 -->
  <path class="wire-pos" d="M133,296 L133,310 L480,310 L480,120 L640,120"/>
  <!-- Cable gland indicator -->
  <ellipse class="cable-gland" cx="550" cy="120" rx="8" ry="6"/>

  <!-- Valve 1 (-)  back to Adapter 1 (-) -->
  <path class="wire-neg" d="M640,160 L500,160 L500,340 L195,340 L195,355"/>
  <text class="label-wire label-neg" x="195" y="336" text-anchor="middle">&minus;</text>
  <!-- Cable gland indicator -->
  <ellipse class="cable-gland" cx="550" cy="160" rx="8" ry="6"/>

  <!-- ============ CIRCUIT 2: Adapter 2 → Relay CH2 → Valve 2 ============ -->

  <!-- Adapter 2 (+) to Relay CH2 COM -->
  <path class="wire-pos" d="M255,355 L255,330 L187,330 L187,296"/>
  <text class="label-wire label-pos" x="220" y="326">+</text>

  <!-- Relay CH2 NO to cable gland to Valve 2 -->
  <path class="wire-pos" d="M223,296 L223,320 L460,320 L460,385 L640,385"/>
  <!-- Cable gland -->
  <ellipse class="cable-gland" cx="550" cy="385" rx="8" ry="6"/>

  <!-- Valve 2 (-) back to Adapter 2 (-) -->
  <path class="wire-neg" d="M640,425 L520,425 L520,350 L285,350 L285,355"/>
  <text class="label-wire label-neg" x="285" y="346" text-anchor="middle">&minus;</text>
  <!-- Cable gland -->
  <ellipse class="cable-gland" cx="550" cy="425" rx="8" ry="6"/>

  <!-- ============ VALVE 1 ============ -->
  <rect class="valve-body" x="640" y="100" width="80" height="70" rx="6"/>
  <rect class="valve-coil" x="660" y="80" width="40" height="25" rx="3"/>
  <text class="label-sm" x="680" y="97" text-anchor="middle">coil</text>
  <text class="label-bold" x="680" y="128" text-anchor="middle">Valve 1</text>
  <text class="label-sm" x="680" y="143" text-anchor="middle" fill="#27ae60" font-weight="600">Blueberries</text>
  <!-- + / - labels on valve leads -->
  <text class="label-wire label-pos" x="635" y="124" text-anchor="end">+</text>
  <text class="label-wire label-neg" x="635" y="164" text-anchor="end">&minus;</text>

  <!-- ============ VALVE 2 ============ -->
  <rect class="valve-body" x="640" y="365" width="80" height="70" rx="6"/>
  <rect class="valve-coil" x="660" y="345" width="40" height="25" rx="3"/>
  <text class="label-sm" x="680" y="362" text-anchor="middle">coil</text>
  <text class="label-bold" x="680" y="393" text-anchor="middle">Valve 2</text>
  <text class="label-sm" x="680" y="408" text-anchor="middle" fill="#e67e22" font-weight="600">Peppers</text>
  <text class="label-wire label-pos" x="635" y="389" text-anchor="end">+</text>
  <text class="label-wire label-neg" x="635" y="429" text-anchor="end">&minus;</text>

  <!-- ============ LEGEND / NOTE ============ -->
  <rect class="note-box" x="740" y="210" width="210" height="100"/>
  <text class="label-bold" x="840" y="235" text-anchor="middle">How it works</text>
  <text class="label-sm" x="750" y="255">GPIO HIGH (3.3V):</text>
  <text class="label-sm" x="760" y="270">relay closes → valve opens</text>
  <text class="label-sm" x="750" y="290">GPIO LOW (0V):</text>
  <text class="label-sm" x="760" y="305">relay opens → valve closes</text>

  <!-- Wire legend -->
  <line x1="755" y1="340" x2="795" y2="340" stroke="#c0392b" stroke-width="2.5"/>
  <text class="label-sm" x="800" y="344">12V DC positive (+)</text>
  <line x1="755" y1="358" x2="795" y2="358" stroke="#2c3e50" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text class="label-sm" x="800" y="362">12V DC negative (&minus;)</text>
  <line x1="755" y1="376" x2="795" y2="376" stroke="#e67e22" stroke-width="4" stroke-linecap="round"/>
  <text class="label-sm" x="800" y="380">120V AC mains</text>

</svg>
</body>
</html>
